[project]
name = "prediction-market-research"
version = "0.1.0"
description = "Calibration, favorite-longshot bias and fee-aware cross-venue pricing on Kalshi and Polymarket."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
# Dependencies follow SPEC section 4. Packages needed only by later milestones are added
# in the milestone that first uses them (recorded in docs/decisions.md).
dependencies = [
    "httpx>=0.27",
    "aiolimiter>=1.1",
    "cryptography>=42",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "polars>=1.10",
    "duckdb>=1.1",
    "pyarrow>=17",
    "zstandard>=0.22",
    "numpy>=2.0",
    "pycryptodome>=3.20",
]

[project.scripts]
pmr = "pmr.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmr"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pmr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "data: needs the local warehouse (run locally only)",
    "network: hits live venue APIs (run locally only)",
    "bench: benchmarks (run locally only)",
    "slow: slow but included in CI",
]

[tool.coverage.run]
source = ["src/pmr"]
branch = false

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
