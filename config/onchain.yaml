# Polymarket history from public Polygon data (owner decisions of 2026-11-10; D-04 replaced).
# Addresses and event topics: docs.polymarket.com contracts page, Polymarket's GitHub repos and
# Polygonscan, read 2026-11-10; topic hashes recomputed with keccak-256 (docs/venue_notes.md).
rpc_url: https://gateway.tenderly.co/public/polygon
rate_limit_rps: 0.5               # the gateway answered 429 after ~50 min at 1 req/s (2026-11-10)
patience_hours: 12                # on refusals, pause with doubling waits instead of failing
max_block_range: 1000000          # the gateway accepted 1M-block ranges, capped at 20,000 results
market_start_block: 29000000      # mid-2022: catches conditions prepared before the study window
fills_start_block: 37520000       # 2023-01-01
full_fills_until: "2024-11-01T00:00:00Z"   # all taker fills before this time
sample: {every_blocks: 1800, window_blocks: 300}   # then ~10 minutes (300 blocks) of every hour
raw_budget_gb: 19.0               # stop before the 20 GB raw budget (NFR-13)
flush_every_pages: 20             # pages are large; bounds memory per collector

exchanges:                        # OrderFilled emitters; taker rows have topics[3] = the exchange
