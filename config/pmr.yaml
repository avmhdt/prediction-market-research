# Main run config (SPEC section 10). ${NAME} placeholders are filled from .env / the environment.
seed: 20261030
study_window: {from: 2023-01-01, to: latest}          # D-01
venues:
  kalshi:
    base_url: ${KALSHI_API_BASE}
    rate_limit_rps: 5            # conservative until confirmed in docs/venue_notes.md
    settlement_lag_hours: 24     # verify; used by lockup
    storage_allowed: true        # owner accepted the risk on 2026-11-09 (docs/decisions.md)
  polymarket:
    gamma_url: https://gamma-api.polymarket.com
    clob_url: https://clob.polymarket.com
    data_url: https://data-api.polymarket.com/v2   # v1 retired (410 Gone) by 2026-11-09; docs/venue_notes.md
    rate_limit_rps: 5
    settlement_lag_hours: 24     # verify UMA liveness period
    onchain_source: dune         # dune | subgraph | none   (D-04)
  manifold: {base_url: https://api.manifold.markets/v0, rate_limit_rps: 5, min_unique_traders: 10}
  metaculus: {base_url: https://www.metaculus.com/api, rate_limit_rps: 2}   # /api2 not in the current OpenAPI spec
http: {timeout_s: 30, max_attempts: 6, backoff_base_s: 1.0, backoff_max_s: 60}
calibration:
  horizons: [1h, 1d, 7d, 30d]
  life_fraction: 0.5
  max_spread: 0.10
  bins_equal_width: 10
  bins_equal_count: 10
  liquidity_filter: {min_trades: 10, min_notional: 100}
  bootstrap: {n: 2000, alpha: 0.05, cluster: event_id}
flb:
  price_buckets: [0, 0.05, 0.10, 0.20, 0.35, 0.50, 0.65, 0.80, 0.90, 0.95, 1.0]
  multiple_testing: holm
matching:
  close_window_days: 7
  embed_model: ${PMR_EMBED_MODEL}
  embed_revision: "<pin-hash-in-M3>"
  top_k: 5
  auto_confirm: false            # pairs are confirmed only in contract_map.yaml
arb:
  risk_free: fred_dtb3           # D-10
  collateral_yield: {kalshi: 0.0, polymarket: 0.0}
  transfer_cost_per_contract: 0.0
  min_net_edge: 0.0
  divergence_prior: [1, 1]       # Beta prior for P(divergence | diff type)
mm:
  fair_value: ema_mid
  ema_halflife_s: 300
  half_spread: 0.02
  skew_gamma: 0.0005
  q_max: 100                     # contracts per market
  capital_max: 1000              # USD per strategy
  markouts_s: [300, 3600]
